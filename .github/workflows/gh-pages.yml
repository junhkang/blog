name: GitHub Pages

on:
  push:
    branches:
      - main
  # 예약 발행: 미래 날짜(date) 글이 시각 도달 후 자동 공개되도록 재빌드한다.
  # 03:05 / 09:05 / 15:05 / 21:05 KST. GitHub Actions cron은 UTC 기준이고 실측 수 시간까지 밀린다 — 하루 한 번이면 예약 글이 반나절 늦게 뜬다.
  schedule:
    - cron: '5 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main         # schedule 실행 시에도 항상 소스 브랜치를 빌드한다
          submodules: false  # 테마는 벤더링되어 있어 submodule 불필요
          fetch-depth: 1    # enableGitInfo 를 쓰지 않는다(lastmod 는 front matter 로만) — 히스토리 불필요

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true    # extended 버전 사용

      - name: Build
        run: |
          hugo --minify --baseURL "https://junhkang.com/"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages  # 배포될 브랜치

