baseURL = "https://junhkang.com/"
locale = "ko"
defaultContentLanguage = "ko"
timeZone = "Asia/Seoul"
title = "Jun Kang's Blog"
theme = "hugo-PaperMod"
googleAnalytics = "G-PV53RL6R3L"

# 페이지당 포스트 수 설정 — 바꾸면 /page/N/ URL이 달라진다.
[pagination]
  pagerSize = 5

[minify]
disableXML = true
minifyOutput = true

[params]
  author = "Jun Kang"
  description = "AI와 빅데이터로 건설업계의 디지털 혁신을 이끄는 (주)산군의 Jun Kang입니다. 대규모 데이터 처리, DB 최적화, 확장 가능한 시스템 구축에 관심이 많으며, 개발팀의 건강하고 지속 가능한 성장 문화를 만들어가고 있습니다."
  github = "https://github.com/junhkang"
  linkedin = "https://www.linkedin.com/in/junh-kang"
  env = "production"  # GA 작동을 위한 환경 설정
  favicon = "favicon.ico"
  hideFooter = true       # 전체 푸터를 숨기거나
  images = ["/images/og_img.jpg"]  # 기본 OG/Twitter 이미지 (PaperMod 폴백)
  keywords = ["개발", "백엔드", "클라우드", "DevOps", "데이터베이스", "산군"]  # 배열 형태로 변경

  # 페이지 표시 설정 — 예전엔 [markup.goldmark.renderer]·[[params.socialIcons]] 아래에 있어서 전부 무시되고 있었다.
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  ShowPageNums = true
  ShowLastMod = true
  ShowAllPagesInArchive = true
  ShowTags = true
  DateFormat = "2006-01-02"
  ShareButtons = ["x", "linkedin", "facebook"]

  [params.comments]
    enabled = true
    provider = "giscus"

  [params.giscus]
    repo = "junhkang/blog"
    repoId = "R_kgDON3GHLw"
    category = "General"
    categoryId = "DIC_kwDON3GHL84Cm5Fc"
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "preferred_color_scheme"
    lang = "ko"


# 검색 기능 활성화
[params.search]
  enable = true
  placeholder = "검색어를 입력하세요..."

# 프로필 모드 비활성화하고 regular 모드 사용
[params.profileMode]
  enabled = false

# 홈페이지 설정 추가
[params.homeInfoParams]
  Title = "Jun Kang 👋"
  Content = """
  - AI와 빅데이터로 건설업계의 디지털 혁신을 이끄는 (주)산군의 Jun Kang입니다. 대규모 데이터 처리, DB 최적화, 확장 가능한 시스템 구축에 관심이 많으며, 개발팀의 건강하고 지속 가능한 성장 문화를 만들어가고 있습니다.
  - 주요 관심사: Backend Development, Cloud Computing, DevOps, Database, AI, 개발 문화 형성
  """

# 소셜 아이콘 추가
[[params.socialIcons]]
  name = "github"
  url = "https://github.com/junhkang"
[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/junh-kang"

# 메인 메뉴 설정
[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 1

[[menu.main]]
  identifier = "sankun"
  name = "Sankun"
  url = "/sankun/"
  weight = 2

[[menu.main]]
  identifier = "personal"
  name = "Personal"
  url = "/personal/"
  weight = 3

[[menu.main]]
  identifier = "categories"
  name = "Categories"
  url = "/categories/"
  weight = 4

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 5

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 7

[[menu.main]]
  identifier = "archives"
  name = "Archives"
  url = "/archives/"
  weight = 6

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 8
[[menu.main]]
  identifier = "guestbook"
  name = "Guestbook"
  url = "/guestbook/"
  weight = 9

[markup]
  defaultMarkdownHandler = "goldmark"

  [markup.goldmark]
    [markup.goldmark.parser]
      attribute = true
      footnote = true

    [markup.goldmark.renderer]
      unsafe = true


[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS"]
  # 태그·카테고리별 RSS(/tags/*/index.xml)는 구글이 크롤 예산만 쓰고 색인하지 않는다 — 내보내지 않는다.
  taxonomy = ["HTML"]
  term = ["HTML"]

# GEO: llms.txt — 생성형 검색엔진이 사이트 구조와 대표 문서를 평문으로 파악하게 한다.
[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  rel = "alternate"
  protocol = "https://"

# 태그 페이지는 대부분 글 1편짜리라 얇은 페이지가 된다 — 색인·사이트맵에서 뺀다.
# 카테고리는 실제 허브라서 그대로 둔다.
[[cascade]]
  [cascade.params]
    robotsNoIndex = true
  [cascade.sitemap]
    disable = true
  [cascade.target]
    path = "{/tags,/tags/**}"

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[params.giscus.guestbook]
    repo = "junhkang/blog"
    repoID = "R_kgDON3GHLw"
    category = "guestbook"
    categoryID = "DIC_kwDON3GHL84Cm5Ff"
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "preferred_color_scheme"
    lang = "en"
# 관련 글: 기본값은 날짜 가중치가 있어 같은 해 글끼리만 묶인다. 레거시 개념 글에서 새 심화 글로 링크가 가도록 태그·시리즈만 본다.
[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "series"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
