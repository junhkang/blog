name: GitHub Pages

on:
  push:
    branches:
      - main
  # 예약 발행: 미래 날짜(date) 글이 시각 도달 후 자동 공개되도록 매일 재빌드한다.
  # 09:05 KST (00:05 UTC). GitHub Actions cron은 UTC 기준이며 수 분 지연될 수 있다.
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main         # schedule 실행 시에도 항상 소스 브랜치를 빌드한다
          submodules: false  # 테마는 벤더링되어 있어 submodule 불필요
          fetch-depth: 0    # .GitInfo / lastmod 용 전체 히스토리

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.165.0'
          extended: true    # extended 버전 사용

      - name: Build
        run: |
          hugo --minify --baseURL "https://junhkang.com/"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages  # 배포될 브랜치

